name: Auto-Broadcast Signal Trigger

# FULL-AUTO scheduler with expiry cleanup: runs every minute, asks the server
# which clock phase it is (signal / alert / waiting), and chains the previous
# server signal's message ID so each cycle posts the expiry notice and deletes
# the expired message — fully unattended, 24/7, alert always before signal.
#
# This is the only unattended path that can delete old messages (it remembers
# message IDs between runs via the actions/cache below). Plain cron-job.org
# bodies cannot chain IDs, so cron-job.org delivers accurate signals+alerts
# while old-message cleanup there happens via the app's test-cycle chaining.
#
# SETUP (one-time):
# 1. Deploy the app to Vercel first and note its URL, e.g.
#    https://your-app.vercel.app  (no trailing slash)
# 2. Go to GitHub repo → Settings → Secrets and variables → Actions
# 3. Add these repository secrets:
#    Name:  APP_URL     Value: https://your-app.vercel.app
#    Name:  BOT_TOKEN   Value: <bot token from @BotFather, e.g. 123456:ABC...>
#    Name:  CHAT_ID     Value: <channel id, e.g. -1001234567890 or @channel>
#    Optional — must match Vercel env CRON_SECRET if you set one:
#    Name:  CRON_SECRET Value: <same random string as in Vercel>
# 4. Optional cadence (minutes per cycle, default 15):
#    Name:  INTERVAL_MINUTES Value: 15
#    (The server embeds this in every message as the accurate next-signal time
#    in Kenyan EAT time.)
# 5. Commit this file. Go to the "Actions" tab and confirm the workflow is enabled.
# 6. Use "Run workflow" (workflow_dispatch) once to verify end-to-end.

on:
  schedule:
    # Every minute — the server's clock-phase logic decides whether this tick
    # sends a signal, an alert, or nothing (waiting returns HTTP 200).
    - cron: "* * * * *"
  workflow_dispatch: {}

concurrency:
  # Never run two ticks at once (prevents double sends on backlog catch-up).
  group: auto-broadcast-cycle
  cancel-in-progress: false

jobs:
  trigger-broadcast:
    runs-on: ubuntu-latest
    steps:
      - name: Restore previous signal ID (for expiry chaining)
        id: chain-restore
        uses: actions/cache/restore@v4
        with:
          path: .cron-chain.json
          key: cron-chain-main
          restore-keys: cron-chain-

      - name: Ping cycle endpoint (phase decided by server clock)
        id: ping
        run: |
          if [ -z "${{ secrets.APP_URL }}" ]; then
            echo "❌ APP_URL secret is not set. Go to repo Settings → Secrets and variables → Actions and add APP_URL with your deployed app's URL."
            exit 1
          fi
          if [ -z "${{ secrets.BOT_TOKEN }}" ]; then
            echo "❌ BOT_TOKEN secret is not set. Add it in repo Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ -z "${{ secrets.CHAT_ID }}" ]; then
            echo "❌ CHAT_ID secret is not set. Add it in repo Settings → Secrets and variables → Actions."
            exit 1
          fi

          if [ -n "${{ secrets.CRON_SECRET }}" ]; then
            AUTH_HEADER="Authorization: Bearer ${{ secrets.CRON_SECRET }}"
          else
            AUTH_HEADER="X-No-Auth: true"
          fi

          INTERVAL="${{ secrets.INTERVAL_MINUTES }}"
          if ! [[ "$INTERVAL" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then INTERVAL="15"; fi

          # Chain the previous cycle's server signal (if any) so this tick
          # posts its expiry notice and deletes it before sending anything new.
          PRIOR=""
          if [ -f .cron-chain.json ]; then
            PRIOR=$(jq -r '.lastSignalId // empty' .cron-chain.json 2>/dev/null || true)
          fi
          if [ -n "$PRIOR" ]; then
            CHAIN="\"deletePriorMessageIds\": [$PRIOR], \"sendExpiryNotice\": true,"
          else
            CHAIN=""
          fi

          BODY=$(jq -n \
            --arg bt "${{ secrets.BOT_TOKEN }}" \
            --arg ci "${{ secrets.CHAT_ID }}" \
            --argjson iv "$INTERVAL" \
            --argjson chain "{ $CHAIN \"x\": 1 }" \
            '{botToken:$bt, chatId:$ci, mode:"cycle", intervalMinutes:$iv, siteName:"kicktrade", promoUrl:"http://kicktrade.site", botName:"mrzetuzetu sv 1 bot", botSignature:"kicktrade Over/Under Bot", hashtags:"#TradingSignal #kicktrade #Signals", activeContracts:["UNDER 7","UNDER 8","OVER 2","OVER 3"]} + ($chain | del(.x))')

          echo "Pinging ${{ secrets.APP_URL }}/api/cron/auto-broadcast (mode=cycle, interval=${INTERVAL}m) ..."

          HTTP_STATUS=$(curl -s -o response.txt -w "%{http_code}" \
            -X POST \
            -H "$AUTH_HEADER" \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            "${{ secrets.APP_URL }}/api/cron/auto-broadcast")

          echo "HTTP Status: $HTTP_STATUS"
          echo "Response body:"
          cat response.txt

          if [ "$HTTP_STATUS" -ge 400 ]; then
            echo "⚠️ Request failed with status $HTTP_STATUS"
            exit 1
          fi

          PHASE=$(jq -r '.phase // "unknown"' response.txt)
          echo "Phase: $PHASE"
          echo "phase=$PHASE" >> "$GITHUB_OUTPUT"

          # Remember a freshly sent SIGNAL for the next tick's expiry chaining.
          # (Alerts don't become priors; waiting ticks leave the cache alone.)
          if [ "$PHASE" = "signal" ]; then
            MID=$(jq -r '.messageId // empty' response.txt)
            if [ -n "$MID" ]; then
              jq -n --argjson id "$MID" '{lastSignalId: $id}' > .cron-chain.json
              echo "Cached signal id $MID for next-tick expiry."
            fi
          elif [ "$PHASE" = "both" ]; then
            MID=$(jq -r '.messageId // empty' response.txt)
            if [ -n "$MID" ]; then
              jq -n --argjson id "$MID" '{lastSignalId: $id}' > .cron-chain.json
            fi
          else
            # Alert tick: if it cleaned the prior, drop the cache; otherwise keep it.
            CLEANED=$(jq -r '.cleanup.deleted // [] | length' response.txt 2>/dev/null || echo 0)
            if [ "$CLEANED" != "0" ]; then
              rm -f .cron-chain.json
              echo "Prior signal expired and deleted; cache cleared."
            fi
          fi

          echo "✅ Cycle tick completed successfully."

      - name: Save signal ID for next tick
        if: always() && hashFiles('.cron-chain.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .cron-chain.json
          key: cron-chain-main-${{ github.run_id }}
